name: Build & Publish Release Assets

on:
  # 仅在推送版本标签（如 v0.0.2）时发布，避免每次推送 main 都覆盖已发布版本的安装包
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package macOS & Windows Release ZIPs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: Build Separate macOS & Windows ZIP Packages
        id: pkg
        run: |
          RAW_VER=$(node -p "require('./package.json').version")
          VERSION="v${RAW_VER#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "::error::推送的标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${VERSION} 不一致，请先同步版本号再打标签。"
            exit 1
          fi
          AGY_VER=$(node -p "require('./asar-version').readAsarPackageVersion('./app.asar.ready') || ''")
          if [ -z "${AGY_VER}" ]; then
            echo "::error::无法读取 app.asar.ready 的客户端版本号，预打包汉化文件可能已损坏。"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "agy_version=v${AGY_VER#v}" >> "$GITHUB_OUTPUT"

          MAC_PKG="Antigravity-ZH-CN-${VERSION}-macOS"
          WIN_PKG="Antigravity-ZH-CN-${VERSION}-Windows"

          rm -rf release-assets
          mkdir -p "release-assets/${MAC_PKG}/core" "release-assets/${WIN_PKG}/core"

          # 1. 组装 macOS 完整汉化包（外层仅放双击按钮，底层核心文件收进 core/ 目录，小白打开一目了然）
          cp \
            localize.js \
            asar-tool.js \
            asar-version.js \
            auto-restore.js \
            process-check.js \
            package.json \
            app.asar.ready \
            "release-assets/${MAC_PKG}/core/"
          cp \
            "一键汉化.command" \
            "一键还原.command" \
            README.md \
            LICENSE \
            "release-assets/${MAC_PKG}/"
          chmod +x "release-assets/${MAC_PKG}/"*.command
          # 免 Node 模式据此校验客户端版本与内置汉化包是否一致
          printf '%s\n' "${AGY_VER#v}" > "release-assets/${MAC_PKG}/core/READY_VERSION"

          # 2. 组装 Windows 完整汉化包（外层仅放双击按钮，底层核心文件收进 core/ 目录，小白打开一目了然）
          cp \
            localize.js \
            asar-tool.js \
            asar-version.js \
            auto-restore.js \
            process-check.js \
            package.json \
            app.asar.ready \
            "release-assets/${WIN_PKG}/core/"
          cp \
            "一键汉化.bat" \
            "一键还原.bat" \
            README.md \
            LICENSE \
            "release-assets/${WIN_PKG}/"
          sed -i 's/\r$//; s/$/\r/' "release-assets/${WIN_PKG}/"*.bat
          printf '%s\r\n' "${AGY_VER#v}" > "release-assets/${WIN_PKG}/core/READY_VERSION"

          cd release-assets
          zip -rq "${MAC_PKG}.zip" "${MAC_PKG}"
          zip -rq "${WIN_PKG}.zip" "${WIN_PKG}"
          ls -lh "${MAC_PKG}.zip" "${WIN_PKG}.zip"

      - name: Publish GitHub Release with Platform Packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.version }}
          AGY_VER: ${{ steps.pkg.outputs.agy_version }}
        run: |
          TITLE="${TAG}"
          MAC_ZIP="release-assets/Antigravity-ZH-CN-${TAG}-macOS.zip"
          WIN_ZIP="release-assets/Antigravity-ZH-CN-${TAG}-Windows.zip"
          gh release edit v0.0.1 --repo "${GITHUB_REPOSITORY}" --title "v0.0.1" >/dev/null 2>&1 || true

          cat <<EOF > release-notes.md
          ### 📥 小白一键汉化下载指南（请根据您的电脑系统点击下方对应压缩包下载）

          | 您的电脑系统 | 第 1 步：点击下方 Assets 下载 | 第 2 步：解压后直接双击 |
          | :--- | :--- | :--- |
          | 🍎 **苹果电脑 (macOS)** | **\`Antigravity-ZH-CN-${TAG}-macOS.zip\`** | 双击 **\`一键汉化.command\`** 完成汉化；双击 **\`一键还原.command\`** 恢复默认英文 |
          | 🪟 **Windows 电脑** | **\`Antigravity-ZH-CN-${TAG}-Windows.zip\`** | 双击 **\`一键汉化.bat\`** 完成汉化；双击 **\`一键还原.bat\`** 恢复默认英文 |

          > 💡 **提示**：每个压缩包内均已包含完整的中文汉化包与自动安装引擎，下载解压后直接双击 **\`一键汉化\`** 或 **\`一键还原\`** 即可，无需安装任何编程环境！
          EOF
          sed -i 's/^          //' release-notes.md

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
            UPLOADED=0
            for attempt in 1 2 3; do
              if gh release upload "${TAG}" "${MAC_ZIP}" "${WIN_ZIP}" --clobber --repo "${GITHUB_REPOSITORY}"; then
                UPLOADED=1
                break
              fi
              echo "Upload attempt ${attempt} failed, retrying in 3s..."
              sleep 3
            done
            if [ "${UPLOADED}" != "1" ]; then
              echo "::error::Release 附件上传连续 3 次失败。"
              exit 1
            fi
          else
            gh release create "${TAG}" "${MAC_ZIP}" "${WIN_ZIP}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          fi
          rm -f release-notes.md
