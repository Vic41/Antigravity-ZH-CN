name: Build & Publish Release Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package macOS & Windows Release ZIPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Separate macOS & Windows ZIP Packages
        id: pkg
        run: |
          RAW_VER=$(node -p "require('./package.json').version")
          VERSION="v${RAW_VER#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          MAC_PKG="Antigravity-ZH-CN-${VERSION}-macOS"
          WIN_PKG="Antigravity-ZH-CN-${VERSION}-Windows"

          rm -rf release-assets
          mkdir -p "release-assets/${MAC_PKG}/core" "release-assets/${WIN_PKG}/core"

          # 1. 组装 macOS 完整汉化包（外层仅放双击按钮，底层核心文件收进 core/ 目录，小白打开一目了然）
          cp \
            localize.js \
            asar-tool.js \
            asar-version.js \
            auto-restore.js \
            process-check.js \
            package.json \
            app.asar.ready \
            "release-assets/${MAC_PKG}/core/"
          cp \
            "一键汉化.command" \
            "还原英文原版.command" \
            README.md \
            "release-assets/${MAC_PKG}/"
          chmod +x "release-assets/${MAC_PKG}/"*.command

          # 2. 组装 Windows 完整汉化包（外层仅放双击按钮，底层核心文件收进 core/ 目录，小白打开一目了然）
          cp \
            localize.js \
            asar-tool.js \
            asar-version.js \
            auto-restore.js \
            process-check.js \
            package.json \
            app.asar.ready \
            "release-assets/${WIN_PKG}/core/"
          cp \
            "一键汉化.bat" \
            "还原英文原版.bat" \
            README.md \
            "release-assets/${WIN_PKG}/"

          cd release-assets
          zip -rq "${MAC_PKG}.zip" "${MAC_PKG}"
          zip -rq "${WIN_PKG}.zip" "${WIN_PKG}"
          ls -lh "${MAC_PKG}.zip" "${WIN_PKG}.zip"

      - name: Publish GitHub Release with Platform Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}
          name: "${{ steps.pkg.outputs.version }} - Antigravity 一键深度汉化包（适配官方 v2.28.2）"
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ### 📥 小白一键汉化下载指南（请根据您的电脑系统点击下方对应压缩包下载）

            | 您的电脑系统 | 第 1 步：点击下方 Assets 下载 | 第 2 步：解压后直接双击 |
            | :--- | :--- | :--- |
            | 🍎 **苹果电脑 (macOS)** | **`Antigravity-ZH-CN-${{ steps.pkg.outputs.version }}-macOS.zip`** | 解压后双击 **`一键汉化.command`** 即可全自动完成汉化并重启 |
            | 🪟 **Windows 电脑** | **`Antigravity-ZH-CN-${{ steps.pkg.outputs.version }}-Windows.zip`** | 解压后双击 **`一键汉化.bat`** 即可全自动完成汉化并重启 |

            > 💡 **提示**：每个压缩包内均已包含完整的中文汉化包与自动安装引擎，下载解压后**直接双击 `一键汉化`** 即可，无需安装任何编程环境！如需恢复英文，双击文件夹内的 `还原英文原版` 即可。
          files: |
            release-assets/Antigravity-ZH-CN-${{ steps.pkg.outputs.version }}-macOS.zip
            release-assets/Antigravity-ZH-CN-${{ steps.pkg.outputs.version }}-Windows.zip
